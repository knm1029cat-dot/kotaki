<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>心理学用語トレーニング</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #222;
      --muted: #667085;
      --border: #e6e8ef;
      --accent: #4f46e5;
      --accent-soft: #eef0ff;
      --good: #16a34a;
      --mid: #d97706;
      --bad: #dc2626;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: linear-gradient(180deg, #f7f8fd 0%, #f2f5fb 100%);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 18px 14px 40px;
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 2rem);
      margin: 0 0 6px;
    }

    .sub {
      color: var(--muted);
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .label {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .term {
      font-size: clamp(1.45rem, 5vw, 2rem);
      font-weight: 800;
      margin-bottom: 10px;
      line-height: 1.3;
      word-break: break-word;
    }

    .answer {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 14px;
      background: #fafbff;
      border: 1px solid var(--border);
      white-space: pre-wrap;
      font-size: 0.98rem;
    }

    .answer.show { display: block; }

    .buttons, .eval-buttons, .mode-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 13px 16px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.04s ease, opacity 0.2s ease, box-shadow 0.2s ease;
      min-height: 48px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    button:active { transform: translateY(1px); }
    button:hover { opacity: 0.95; }

    .primary {
      background: var(--accent);
      color: white;
    }

    .secondary {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .ghost {
      background: #f8f9fc;
      color: #475467;
      border: 1px solid var(--border);
    }

    .good { background: #ecfdf3; color: var(--good); }
    .mid { background: #fff7ed; color: var(--mid); }
    .bad { background: #fef2f2; color: var(--bad); }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .stat-box {
      background: #fafbff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      min-width: 0;
    }

    .stat-title {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .stat-value {
      font-size: 1.35rem;
      font-weight: 800;
      margin-top: 4px;
      line-height: 1.2;
    }

    textarea {
      width: 100%;
      min-height: 240px;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      font: inherit;
      resize: vertical;
      background: #fff;
    }

    details summary {
      cursor: pointer;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .hint {
      color: var(--muted);
      font-size: 0.92rem;
      margin-top: 10px;
    }

    .small {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .top-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .chip {
      background: #f8f9fc;
      border: 1px solid var(--border);
      color: #475467;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .mode-buttons button.active {
      outline: 2px solid rgba(79, 70, 229, 0.18);
    }

    @media (max-width: 640px) {
      .container {
        padding: 12px 10px 28px;
      }

      .card {
        padding: 15px;
        border-radius: 16px;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .buttons button,
      .eval-buttons button,
      .mode-buttons button {
        flex: 1 1 calc(50% - 10px);
      }

      .buttons button.primary {
        flex-basis: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>心理学用語トレーニング</h1>
    <div class="sub">用語を見て自分で説明 → 答え確認 → 自己評価できる、スマホ向けの心理学用語トレーニングサイト</div>

    <div class="card">
      <div class="row">
        <div>
          <div class="label">問題</div>
          <div id="term" class="term">読み込み中...</div>
        </div>
        <div class="top-meta">
          <div class="chip" id="termCount">0語</div>
          <div class="chip" id="sessionCount">今日の10問 0/10</div>
        </div>
      </div>

      <div class="mode-buttons">
        <button class="ghost active" id="allModeBtn" onclick="setMode('all')">全問題</button>
        <button class="ghost" id="weakModeBtn" onclick="setMode('weak')">苦手中心</button>
        <button class="ghost" id="dailyModeBtn" onclick="setMode('daily')">今日の10問</button>
      </div>

      <div id="answer" class="answer"></div>

      <div class="buttons">
        <button class="primary" onclick="showAnswer()">答えを見る</button>
        <button class="secondary" onclick="nextQuestion()">次の問題</button>
      </div>

      <div class="eval-buttons">
        <button class="good" onclick="evaluateCurrent('good')">◎ 書けた</button>
        <button class="mid" onclick="evaluateCurrent('mid')">△ あいまい</button>
        <button class="bad" onclick="evaluateCurrent('bad')">✕ わからない</button>
      </div>

      <div class="hint">おすすめの使い方：紙やノートに説明を書いてから「答えを見る」を押す</div>
    </div>

    <div class="card">
      <div class="label">学習状況</div>
      <div class="stats">
        <div class="stat-box">
          <div class="stat-title">◎ 書けた</div>
          <div class="stat-value" id="goodCount">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-title">△ あいまい</div>
          <div class="stat-value" id="midCount">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-title">✕ わからない</div>
          <div class="stat-value" id="badCount">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-title">進捗率</div>
          <div class="stat-value" id="progressRate">0%</div>
        </div>
      </div>
    </div>

    <div class="card">
      <details>
        <summary>用語を追加・編集する</summary>
        <p class="small">1行に1語ずつ、<strong>用語 | 説明</strong> の形で入力してね。</p>
        <textarea id="termsInput"></textarea>
        <div class="buttons">
          <button class="primary" onclick="saveTerms()">保存する</button>
          <button class="secondary" onclick="loadSampleTerms()">サンプルを入れる</button>
          <button class="secondary" onclick="resetProgress()">評価だけリセット</button>
        </div>
      </details>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'psych_terms_data_v2';
    const PROGRESS_KEY = 'psych_terms_progress_v2';

    const defaultTerms = [
      { term: '古典的条件づけ', answer: '中性刺激と無条件刺激を対提示することで、中性刺激が条件刺激となり、条件反応を引き起こすようになる学習。' },
      { term: 'オペラント条件づけ', answer: '行動の結果として与えられる強化や罰によって、その行動の生起頻度が変化する学習。' },
      { term: '社会的促進', answer: '他者の存在によって、単純または習熟した課題の遂行が促進される現象。' },
      { term: 'プロスペクト理論', answer: '利得と損失に対する主観的価値づけは対称ではなく、人は一般に同程度の利得より損失を大きく感じるとする意思決定理論。' },
      { term: 'ワーキングメモリ', answer: '情報を一時的に保持しながら同時に処理する認知機能の仕組み。' }
    ];

    let terms = [];
    let progress = {};
    let currentIndex = 0;
    let currentMode = 'all';
    let dailySet = [];
    let dailyAnswered = [];

    function loadTerms() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          terms = JSON.parse(saved);
        } catch {
          terms = [...defaultTerms];
        }
      } else {
        terms = [...defaultTerms];
      }

      const savedProgress = localStorage.getItem(PROGRESS_KEY);
      if (savedProgress) {
        try {
          progress = JSON.parse(savedProgress);
        } catch {
          progress = {};
        }
      }

      document.getElementById('termsInput').value = terms
        .map(item => `${item.term} | ${item.answer}`)
        .join('
');

      rebuildDailySet();
      updateCounts();
      updateTermCount();
      updateModeButtons();
      nextQuestion(true);
    }

    function updateTermCount() {
      document.getElementById('termCount').textContent = `${terms.length}語`;
      updateSessionCount();
    }

    function updateSessionCount() {
      document.getElementById('sessionCount').textContent = `今日の10問 ${dailyAnswered.length}/${dailySet.length || 10}`;
    }

    function rebuildDailySet() {
      const shuffled = [...terms].sort(() => Math.random() - 0.5);
      dailySet = shuffled.slice(0, Math.min(10, shuffled.length));
      dailyAnswered = [];
      updateSessionCount();
    }

    function getPool() {
      if (currentMode === 'weak') {
        const weak = terms.filter(item => {
          const state = progress[item.term];
          return state === 'mid' || state === 'bad' || !state;
        });
        return weak.length ? weak : terms;
      }

      if (currentMode === 'daily') {
        const unanswered = dailySet.filter(item => !dailyAnswered.includes(item.term));
        return unanswered.length ? unanswered : dailySet;
      }

      return terms;
    }

    function nextQuestion(initial = false) {
      if (!terms.length) {
        document.getElementById('term').textContent = '用語がありません';
        document.getElementById('answer').classList.remove('show');
        document.getElementById('answer').textContent = '';
        return;
      }

      if (currentMode === 'daily' && dailySet.length === 0) {
        rebuildDailySet();
      }

      const pool = getPool();
      if (!pool.length) {
        document.getElementById('term').textContent = '今日の10問が終わったよ';
        const answerBox = document.getElementById('answer');
        answerBox.classList.add('show');
        answerBox.textContent = 'おつかれさま。もう一度やるなら「今日の10問」を押し直してね。';
        return;
      }

      let next;
      if (pool.length === 1) {
        next = 0;
      } else {
        const currentTerm = terms[currentIndex]?.term;
        do {
          next = Math.floor(Math.random() * pool.length);
        } while (pool[next].term === currentTerm && pool.length > 1);
      }

      const selected = pool[next];
      currentIndex = terms.findIndex(item => item.term === selected.term);
      document.getElementById('term').textContent = terms[currentIndex].term;
      const answerBox = document.getElementById('answer');
      answerBox.classList.remove('show');
      answerBox.textContent = terms[currentIndex].answer;

      if (!initial) window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showAnswer() {
      document.getElementById('answer').classList.add('show');
    }

    function evaluateCurrent(level) {
      const current = terms[currentIndex];
      if (!current) return;
      progress[current.term] = level;
      if (currentMode === 'daily' && !dailyAnswered.includes(current.term)) {
        dailyAnswered.push(current.term);
      }
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
      updateCounts();
      updateSessionCount();
      nextQuestion();
    }

    function updateCounts() {
      const values = Object.values(progress);
      const good = values.filter(v => v === 'good').length;
      const mid = values.filter(v => v === 'mid').length;
      const bad = values.filter(v => v === 'bad').length;
      document.getElementById('goodCount').textContent = good;
      document.getElementById('midCount').textContent = mid;
      document.getElementById('badCount').textContent = bad;
      const rate = terms.length ? Math.round((good / terms.length) * 100) : 0;
      document.getElementById('progressRate').textContent = `${rate}%`;
    }

    function saveTerms() {
      const raw = document.getElementById('termsInput').value.trim();
      const lines = raw.split('
').map(line => line.trim()).filter(Boolean);
      const parsed = [];

      for (const line of lines) {
        const parts = line.split('|');
        if (parts.length < 2) continue;
        const term = parts[0].trim();
        const answer = parts.slice(1).join('|').trim();
        if (term && answer) parsed.push({ term, answer });
      }

      if (!parsed.length) {
        alert('「用語 | 説明」の形で1つ以上入力してね。');
        return;
      }

      terms = parsed;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(terms));
      rebuildDailySet();
      updateTermCount();
      updateCounts();
      nextQuestion(true);
      alert('保存したよ。');
    }

    function loadSampleTerms() {
      document.getElementById('termsInput').value = defaultTerms
        .map(item => `${item.term} | ${item.answer}`)
        .join('
');
    }

    function resetProgress() {
      progress = {};
      dailyAnswered = [];
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
      updateCounts();
      updateSessionCount();
      nextQuestion(true);
      alert('評価をリセットしたよ。');
    }

    function setMode(mode) {
      currentMode = mode;
      if (mode === 'daily') {
        rebuildDailySet();
      }
      updateModeButtons();
      nextQuestion(true);
    }

    function updateModeButtons() {
      document.getElementById('allModeBtn').classList.toggle('active', currentMode === 'all');
      document.getElementById('weakModeBtn').classList.toggle('active', currentMode === 'weak');
      document.getElementById('dailyModeBtn').classList.toggle('active', currentMode === 'daily');
    }

    loadTerms();
  </script>
</body>
</html>
